<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>
		<title>Closer To Christ</title>
		<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
		<script>
			// Runs before any image loads: picks a starting quality level (and
			// with it the image size) from what the browser says about the
			// connection and device. Unless that's already low, the scene layers
			// stay hidden (data-probing) so no image downloads until app.js has
			// timed a small test download. The reason shows in the settings panel.
			(() => {
				const root = document.documentElement;
				const phone = matchMedia("(max-width: 900px)");
				// Only actual touch phones count; a narrow desktop window doesn't.
				const touchPhone = matchMedia("(max-width: 900px) and (pointer: coarse)");
				const connection = navigator.connection; // Chromium only
				const memory = navigator.deviceMemory ?? 8; // GB; Chromium only
				// A step-down saved after a slow frame rate (app.js). The key was
				// renamed so ones saved by an older, too-strict check are ignored.
				let saved = null;
				try {
					saved = localStorage.getItem("loweredQuality");
				} catch {}

				const [quality, reason] = saved
					? [saved, "lowered earlier for a slow frame rate"]
					: connection?.saveData
						? ["low", "data saver is on"]
						: memory <= 2
							? ["low", `${memory}GB memory`]
							: touchPhone.matches
								? ["medium", "phone"]
								: ["high", "fast device and connection"];
				root.dataset.quality = quality;
				root.dataset.qualityReason = reason;
				if (quality !== "low") root.dataset.probing = "";

				const setAssets = () => {
					root.dataset.assets = phone.matches ? "small" : "full";
				};
				setAssets();
				phone.addEventListener("change", setAssets);
			})();
		</script>
		<link rel="stylesheet" href="./styles.css" />
	</head>
	<body>
		<section id="sky" data-z_index="1"></section>

		<div id="storm" aria-hidden="true">
			<section
				class="storm-cloud storm-cloud--far"
				data-z_index="0.45"
			>
				<span class="storm-cloud__texture"></span>
			</section>
			<div
				id="lightning-back"
				class="lightning-layer lightning-layer--back"
			></div>
			<section
				class="storm-cloud storm-cloud--deep"
				data-z_index="0.9"
			>
				<span class="storm-cloud__texture"></span>
			</section>
			<div
				id="lightning-middle"
				class="lightning-layer lightning-layer--middle"
			></div>
			<section
				class="storm-cloud storm-cloud--middle"
				data-z_index="1.55"
			>
				<span class="storm-cloud__texture"></span>
			</section>
			<section
				class="storm-cloud storm-cloud--midband"
				data-z_index="1.95"
			>
				<span class="storm-cloud__texture"></span>
			</section>
			<section
				class="storm-cloud storm-cloud--lower"
				data-z_index="2.45"
			>
				<span class="storm-cloud__texture"></span>
			</section>
			<div
				id="lightning-front"
				class="lightning-layer lightning-layer--front"
			></div>
			<section
				class="storm-cloud storm-cloud--near"
				data-z_index="3.7"
			>
				<span class="storm-cloud__texture"></span>
			</section>

			<div id="rain-back" class="rain-layer rain-layer--back"></div>
			<div id="storm-tone" class="storm-tone"></div>
			<div id="rain-front" class="rain-layer rain-layer--front"></div>
		</div>

		<section
			class="scenery"
			data-scenery="distant-hills"
			data-z_index="1.5"
		></section>

		<section
			class="scenery"
			data-scenery="distant-jerusalem"
			data-z_index="2.5"
		>
			<span class="city-light city-light--architecture"></span>
			<span class="city-light city-light--home city-light--home-1"></span>
			<span class="city-light city-light--home city-light--home-2"></span>
			<span class="city-light city-light--home city-light--home-3"></span>
			<span class="city-light city-light--home city-light--home-4"></span>
			<span class="city-light city-light--home city-light--home-5"></span>
			<span class="city-light city-light--lantern city-light--lantern-common"></span>
			<span class="city-light city-light--lantern city-light--lantern-variant"></span>
			<span class="city-flicker-plane"></span>
		</section>

		<section
			class="scenery"
			data-scenery="golgotha-ridge"
			data-z_index="4.5"
		></section>

		<section
			class="scenery"
			data-scenery="ground"
			data-z_index="8"
		></section>

		<img
			id="christ"
			data-z_index="16"
			src="./assets/gifs/christ-wind-120ms-57f.gif"
			alt=""
		/>

		<button
			id="settings-button"
			class="settings-button"
			type="button"
			aria-label="Scene Settings"
			aria-haspopup="dialog"
		>
			<!-- Gear drawn symmetric around (12, 12) so it spins in place. -->
			<svg viewBox="0 0 24 24" aria-hidden="true">
				<path d="M9.78 4.73 L9.88 2.02 L14.12 2.02 L14.22 4.73 L15.57 5.29 L17.56 3.45 L20.55 6.44 L18.71 8.43 L19.27 9.78 L21.98 9.88 L21.98 14.12 L19.27 14.22 L18.71 15.57 L20.55 17.56 L17.56 20.55 L15.57 18.71 L14.22 19.27 L14.12 21.98 L9.88 21.98 L9.78 19.27 L8.43 18.71 L6.44 20.55 L3.45 17.56 L5.29 15.57 L4.73 14.22 L2.02 14.12 L2.02 9.88 L4.73 9.78 L5.29 8.43 L3.45 6.44 L6.44 3.45 L8.43 5.29 Z" />
				<circle cx="12" cy="12" r="3.2" />
			</svg>
		</button>

		<dialog id="settings" class="settings" aria-labelledby="settings-title">
			<form method="dialog" class="settings-card">
				<header class="settings-header">
					<span class="overlay-eyebrow">Closer to Christ</span>
					<h2 id="settings-title" class="settings-title">Scene Settings</h2>
					<button class="settings-close" aria-label="Close settings">
						<svg viewBox="0 0 24 24" aria-hidden="true">
							<path d="M6 6l12 12M18 6L6 18" />
						</svg>
					</button>
				</header>

				<fieldset class="settings-group">
					<legend>Motion</legend>
					<label class="settings-row">
						<span class="settings-label">
							Parallax
							<small>The scene follows your mouse or phone tilt</small>
						</span>
						<input class="settings-switch-input" type="checkbox" name="parallax" role="switch" />
						<span class="settings-switch" aria-hidden="true"></span>
					</label>
					<label class="settings-row settings-row--stacked">
						<span class="settings-label">
							Smoothness
							<output name="smoothingValue"></output>
							<small>Higher eases the scene, and fast flicks swing a little past and settle</small>
						</span>
						<input type="range" name="parallaxSmoothing" min="0" max="0.5" step="0.01" />
					</label>
				</fieldset>

				<section class="settings-group" aria-labelledby="settings-details-title">
					<h3 id="settings-details-title" class="settings-group-title">Render details</h3>
					<dl class="settings-details"></dl>
				</section>
			</form>
		</dialog>

		<div id="motion-prompt" class="overlay" hidden>
			<div class="overlay-card" role="dialog" aria-labelledby="motion-prompt-title">
				<span class="overlay-eyebrow">Closer to Christ</span>
				<h2 id="motion-prompt-title" class="overlay-title">Explore with motion?</h2>
				<p class="overlay-copy">
					Tilt your phone to look around the scene. You can change this
					any time in settings.
				</p>
				<div class="overlay-actions">
					<button class="overlay-button overlay-button--primary" type="button" data-answer="yes">
						Enable motion
					</button>
					<button class="overlay-button" type="button" data-answer="no">
						Not now
					</button>
				</div>
			</div>
		</div>

		<div id="loading" class="overlay" role="status" aria-live="polite">
			<span class="overlay-card">
				<span class="loading-emblem">
					<svg class="loading-cross" viewBox="0 0 40 56" aria-hidden="true">
						<defs>
							<clipPath id="loading-cross-shape">
								<path id="loading-cross-path" d="M17 2h6v12h11v6H23v34h-6V20H6v-6h11z" />
							</clipPath>
						</defs>
						<rect class="loading-cross__fill" width="40" height="56" clip-path="url(#loading-cross-shape)" />
						<use class="loading-cross__base" href="#loading-cross-path" />
						<path class="loading-cross__glint" d="M17 2h6v12h11v6H23v34h-6V20H6v-6h11z" pathLength="100" />
					</svg>
				</span>
				<span class="overlay-eyebrow">Closer to Christ</span>
				<span class="overlay-title">Preparing the scene</span>
				<span class="loading-progress"></span>
				<span class="loading-verse">
					&ldquo;Draw near unto me and I will draw near unto you.&rdquo;
					<cite>D&amp;C 88:63</cite>
				</span>
			</span>
		</div>

		<script src="./app.js"></script>
		<script>
			loadScene().then(() => {
				createStars({ high: 300, medium: 150, low: 90 }[getQuality()]);
				createShootingStars();
				createStorm();
				createCityLights();
				parallax();
				settingsPanel();
			});
		</script>
	</body>
</html>
