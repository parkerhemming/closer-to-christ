<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>
		<title>Closer To Christ</title>
		<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
		<script>
			// Runs before any image loads. Picks the quality level (a saved
			// choice wins; otherwise a guess from the device) and the image
			// size. app.js lowers the quality later if the scene runs slowly.
			(() => {
				const root = document.documentElement;
				const phone = matchMedia("(max-width: 900px)");
				const memory = navigator.deviceMemory ?? 8; // GB; Chromium only
				let saved = null;
				try {
					saved = localStorage.getItem("quality");
				} catch {}
				root.dataset.quality =
					saved ??
					(memory <= 2 || navigator.connection?.saveData
						? "low"
						: phone.matches || memory <= 4
							? "medium"
							: "high");
				const setAssets = () => {
					root.dataset.assets = phone.matches ? "small" : "full";
				};
				setAssets();
				phone.addEventListener("change", setAssets);
			})();
		</script>
		<link rel="stylesheet" href="./styles.css" />
	</head>
	<body>
		<section id="sky" data-z_index="1"></section>

		<div id="storm" aria-hidden="true">
			<section
				class="storm-cloud storm-cloud--far"
				data-z_index="0.45"
			>
				<span class="storm-cloud__texture"></span>
			</section>
			<div
				id="lightning-back"
				class="lightning-layer lightning-layer--back"
			></div>
			<section
				class="storm-cloud storm-cloud--deep"
				data-z_index="0.9"
			>
				<span class="storm-cloud__texture"></span>
			</section>
			<div
				id="lightning-middle"
				class="lightning-layer lightning-layer--middle"
			></div>
			<section
				class="storm-cloud storm-cloud--middle"
				data-z_index="1.55"
			>
				<span class="storm-cloud__texture"></span>
			</section>
			<section
				class="storm-cloud storm-cloud--midband"
				data-z_index="1.95"
			>
				<span class="storm-cloud__texture"></span>
			</section>
			<section
				class="storm-cloud storm-cloud--lower"
				data-z_index="2.45"
			>
				<span class="storm-cloud__texture"></span>
			</section>
			<div
				id="lightning-front"
				class="lightning-layer lightning-layer--front"
			></div>
			<section
				class="storm-cloud storm-cloud--near"
				data-z_index="3.7"
			>
				<span class="storm-cloud__texture"></span>
			</section>

			<div id="rain-back" class="rain-layer rain-layer--back"></div>
			<div id="storm-tone" class="storm-tone"></div>
			<div id="rain-front" class="rain-layer rain-layer--front"></div>
		</div>

		<section
			class="scenery"
			data-scenery="distant-hills"
			data-z_index="1.5"
		></section>

		<section
			class="scenery"
			data-scenery="distant-jerusalem"
			data-z_index="2.5"
		>
			<span class="city-light city-light--architecture"></span>
			<span class="city-light city-light--home city-light--home-1"></span>
			<span class="city-light city-light--home city-light--home-2"></span>
			<span class="city-light city-light--home city-light--home-3"></span>
			<span class="city-light city-light--home city-light--home-4"></span>
			<span class="city-light city-light--home city-light--home-5"></span>
			<span class="city-light city-light--lantern city-light--lantern-common"></span>
			<span class="city-light city-light--lantern city-light--lantern-variant"></span>
			<span class="city-flicker-plane"></span>
		</section>

		<section
			class="scenery"
			data-scenery="golgotha-ridge"
			data-z_index="4.5"
		></section>

		<section
			class="scenery"
			data-scenery="ground"
			data-z_index="8"
		></section>

		<img
			id="christ"
			data-z_index="16"
			src="./assets/gifs/christ-wind-120ms-57f.gif"
			alt=""
		/>

		<button
			id="motion-trigger"
			class="overlay"
			type="button"
			aria-label="Enable motion parallax"
			hidden
		>
			<span class="overlay-card">
				<span class="overlay-eyebrow">Closer to Christ</span>
				<span class="overlay-title">Click to Start</span>
				<span class="overlay-copy">
					Enable motion and tilt your phone to explore the scene
				</span>
			</span>
		</button>

		<div id="loading" class="overlay" role="status" aria-live="polite">
			<span class="overlay-card">
				<span class="loading-emblem">
					<svg class="loading-cross" viewBox="0 0 40 56" aria-hidden="true">
						<defs>
							<clipPath id="loading-cross-shape">
								<path id="loading-cross-path" d="M17 2h6v12h11v6H23v34h-6V20H6v-6h11z" />
							</clipPath>
						</defs>
						<rect class="loading-cross__fill" width="40" height="56" clip-path="url(#loading-cross-shape)" />
						<use class="loading-cross__base" href="#loading-cross-path" />
						<path class="loading-cross__glint" d="M17 2h6v12h11v6H23v34h-6V20H6v-6h11z" pathLength="100" />
					</svg>
				</span>
				<span class="overlay-eyebrow">Closer to Christ</span>
				<span class="overlay-title">Preparing the scene</span>
				<span class="loading-progress"></span>
				<span class="loading-verse">
					&ldquo;Draw near unto me and I will draw near unto you.&rdquo;
					<cite>D&amp;C 88:63</cite>
				</span>
			</span>
		</div>

		<script src="./app.js"></script>
		<script>
			loadScene().then(() => {
				createStars({ high: 300, medium: 150, low: 90 }[getQuality()]);
				createShootingStars();
				createStorm();
				createCityLights();
				parallax();
			});
		</script>
	</body>
</html>
