<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Closer To Christ</title>
		<link rel="stylesheet" href="./styles.css" />
	</head>
	<body>
		<section id="sky" data-z_index="1"></section>

		<section
			class="scenery"
			data-scenery="distant-hills"
			data-z_index="1.5"
		></section>

		<section
			class="scenery"
			data-scenery="distant-jerusalem"
			data-z_index="2.5"
		></section>

		<section
			class="scenery"
			data-scenery="golgotha-ridge"
			data-z_index="4.5"
		></section>

		<section
			class="scenery"
			data-scenery="ground"
			data-z_index="8"
		></section>

		<img
			id="christ"
			data-z_index="16"
			src="./assets/gifs/christ-wind-120ms-57f.gif"
		/>

		<button
			id="motion-trigger"
			type="button"
			aria-label="Enable motion parallax"
			hidden
		>
			<span class="motion-start-card">
				<span class="motion-start-eyebrow">Closer to Christ</span>
				<span class="motion-start-title">Click to Start</span>
				<span class="motion-start-copy">
					Enable motion and tilt your phone to explore the scene
				</span>
			</span>
		</button>

		<script src="./app.js"></script>
		<script>
			createStars(300);
			createShootingStars();
			parallax();
		</script>
	</body>
</html>
